# .github/workflows/<app>.yml
name: <app>

on:
  push:
    branches: [main]
    paths: [<backend>/**, <data-folder>/**, .github/workflows/<app>.yml]
  pull_request:
    paths: [<backend>/**, .github/workflows/<app>.yml]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: <backend>
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests that connect as the OS user pick these up through libpq.
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: <backend>/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  deploy:
    if: github.event_name == 'push'
    needs: [backend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: <backend>/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters "commands=[\"/opt/<app>/deploy.sh $IMAGE\"]" \
            --query Command.CommandId --output text)
          sleep 5
          # Poll rather than `aws ssm wait`, which gives up after ~100 s.
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text)
            case "$status" in
              Success) break ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "deploy $status"; break ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ]
